experiment_name: nemotron_nano_gozaru_lora_single
mlflow_experiment_directory: /Workspace/Users/hiroshi.ouchiyama@databricks.com

# databricks_ai_v5 base image ships torch + core ML libs; we add the rest inline.
environment:
  version: 'databricks_ai_v5'
  dependencies:
    - transformers==4.57.3
    - tokenizers==0.22.1
    - trl
    - peft
    - hf_transfer
    # Nemotron-Nano-v2 is a Mamba-Transformer hybrid -> needs mamba_ssm + causal_conv1d.
    # Prebuilt wheels for torch2.9 / cu12 / cp312 / cxx11abiTRUE, staged in a UC Volume.
    - /Volumes/hiroshi/tmp/wheels/causal_conv1d-1.6.1+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl
    - /Volumes/hiroshi/tmp/wheels/mamba_ssm-2.3.1+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xH100

code_source:
  type: snapshot
  snapshot:
    root_path: .

command: |
  cd $CODE_SOURCE_PATH
  python train.py

env_variables:
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  MODEL_ID: nvidia/NVIDIA-Nemotron-Nano-9B-v2
  DATASET_ID: bbz662bbz/databricks-dolly-15k-ja-gozaru
  OUTPUT_VOL: /Volumes/hiroshi/tmp/model/lora_adapter_02
  # Set MAX_STEPS to a small number (e.g. 5) for a quick smoke test.
  MAX_STEPS: '-1'

max_retries: 0
timeout_minutes: 45
