experiment_name: nemotron_nano_gozaru_fullft_multinode
mlflow_experiment_directory: /Workspace/Users/hiroshi.ouchiyama@databricks.com

environment:
  version: 'databricks_ai_v5'
  dependencies:
    - transformers==4.57.3
    - tokenizers==0.22.1
    - trl
    - peft
    - deepspeed
    - hf_transfer
    - /Volumes/hiroshi/tmp/wheels/causal_conv1d-1.6.1+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl
    - /Volumes/hiroshi/tmp/wheels/mamba_ssm-2.3.1+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl

# MULTI-NODE: 16 GPUs = 2 nodes x 8xH100. num_accelerators must be a multiple of 8.
compute:
  num_accelerators: 16
  accelerator_type: GPU_8xH100

code_source:
  type: snapshot
  snapshot:
    root_path: .

command: |
  cd $CODE_SOURCE_PATH
  # AIR injects NUM_NODES, NODE_RANK, LOCAL_WORLD_SIZE, MASTER_ADDR, MASTER_PORT.
  # torchrun uses them for cross-node rendezvous (one process per GPU per node).
  torchrun \
    --nnodes="${NUM_NODES}" \
    --node_rank="${NODE_RANK}" \
    --nproc_per_node="${LOCAL_WORLD_SIZE:-8}" \
    --master_addr="${MASTER_ADDR}" \
    --master_port="${MASTER_PORT}" \
    train.py

env_variables:
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  MODEL_ID: nvidia/NVIDIA-Nemotron-Nano-9B-v2
  DATASET_ID: bbz662bbz/databricks-dolly-15k-ja-gozaru
  OUTPUT_VOL: /Volumes/hiroshi/tmp/model/nemotron_nano_gozaru_fullft_multinode
  MAX_STEPS: '-1'
  NCCL_DEBUG: WARN
  # Pin NCCL control-plane traffic to the primary interface for cross-node rendezvous.
  NCCL_SOCKET_IFNAME: eth0

max_retries: 0
timeout_minutes: 360
