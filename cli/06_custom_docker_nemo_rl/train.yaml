experiment_name: nemotron_nemo_rl_custom_docker
mlflow_experiment_directory: /Workspace/Users/hiroshi.ouchiyama@databricks.com

# Custom Docker image path. When environment.docker_image is set you CANNOT also
# use environment.dependencies or environment.version — everything must be baked
# into the image (see Dockerfile).
#
# Register the image first (Docker Hub only):
#   air register image <your-dockerhub-user>/air-nemo-rl:v1 \
#     --interactive-authenticate -p e2-demo-field-eng
environment:
  docker_image:
    url: <your-dockerhub-user>/air-nemo-rl:v1

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

code_source:
  type: snapshot
  snapshot:
    root_path: .

# WORKDIR is not honored by AIR — use absolute paths. NeMo-RL lives at
# /opt/nemo-rl in the image. This is a placeholder launch; replace with the
# actual NeMo-RL entry (e.g. a GRPO/SFT recipe) for your run.
command: |
  # AIR injects NUM_NODES / LOCAL_WORLD_SIZE / MASTER_ADDR / MASTER_PORT.
  torchrun \
    --nnodes="${NUM_NODES:-1}" \
    --nproc_per_node="${LOCAL_WORLD_SIZE:-8}" \
    --master_addr="${MASTER_ADDR:-127.0.0.1}" \
    --master_port="${MASTER_PORT:-29500}" \
    /opt/nemo-rl/examples/run_sft.py  # <- replace with your NeMo-RL entry point

env_variables:
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  # If FIPS-enabled hosts cause SSL errors and compliance does not require FIPS:
  # OPENSSL_FORCE_FIPS_MODE: '0'

max_retries: 0
timeout_minutes: 240
