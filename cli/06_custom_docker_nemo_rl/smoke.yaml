# Cheap 1xH100 smoke test: prove the custom image's native/CUDA extensions
# actually IMPORT on a real GPU (the build host had no GPU, so this is the first
# time triton/TE/mamba touch a driver). Run this BEFORE any real 8xH100 training.
experiment_name: nemo_rl_image_smoke
mlflow_experiment_directory: /Workspace/Users/<your-username>@example.com

environment:
  docker_image:
    url: <your-dockerhub-user>/air-nemo-rl:v0.4.0

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xH100

code_source:
  type: snapshot
  snapshot:
    root_path: .

command: |
  python - <<'PY'
  import torch
  print("torch", torch.__version__, "cuda", torch.version.cuda,
        "is_available", torch.cuda.is_available())
  if torch.cuda.is_available():
      print("device", torch.cuda.get_device_name(0))
  import mamba_ssm;          print("OK mamba_ssm")
  import causal_conv1d;      print("OK causal_conv1d")
  import transformer_engine; print("OK transformer_engine")
  import vllm;               print("OK vllm")
  import flash_attn;         print("OK flash_attn")
  print("ALL IMPORTS OK ON GPU")
  PY

env_variables:
  HF_HUB_ENABLE_HF_TRANSFER: '1'
  # Uncomment if FIPS SSL errors appear and compliance does not require FIPS:
  # OPENSSL_FORCE_FIPS_MODE: '0'

max_retries: 0
timeout_minutes: 60
